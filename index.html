<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f5c4d">
<title>المصحف الشريف</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المصحف">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="قائمة السور">☰</button>
  <h1 class="brand">المصحف الشريف</h1>
  <div class="top-actions">
    <button class="icon-btn" id="fontDown" aria-label="تصغير الخط">أ-</button>
    <button class="icon-btn" id="fontUp" aria-label="تكبير الخط">أ+</button>
    <button class="icon-btn" id="themeBtn" aria-label="الوضع الليلي">🌙</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <input type="search" id="searchBox" placeholder="ابحث باسم السورة أو رقمها…" autocomplete="off">
    </div>
    <ul class="surah-list" id="surahList"><li class="muted">جاري تحميل السور…</li></ul>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main class="reader" id="reader">
    <div class="surah-header" id="surahHeader" hidden>
      <div class="surah-title" id="surahTitle"></div>
      <div class="surah-meta" id="surahMeta"></div>
      <form class="jump" id="jumpForm">
        <label for="jumpInput">انتقل للآية</label>
        <input type="number" id="jumpInput" min="1" inputmode="numeric">
        <button type="submit">اذهب</button>
      </form>
    </div>
    <div class="basmala" id="basmala" hidden>بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
    <div class="mushaf" id="mushaf"><p class="muted center">جاري التحميل…</p></div>
    <nav class="surah-nav">
      <button id="prevSurahBtn">→ السورة السابقة</button>
      <button id="nextSurahBtn">السورة التالية ←</button>
    </nav>
  </main>
</div>

<footer class="player">
  <div class="player-row">
    <select id="reciterSelect" aria-label="اختر القارئ"></select>
    <div class="now" id="nowPlaying">اختر قارئًا واضغط تشغيل</div>
  </div>
  <div class="player-row controls">
    <button class="ctl" id="prevBtn" aria-label="السورة السابقة">⏭</button>
    <button class="ctl play" id="playBtn" aria-label="تشغيل">▶</button>
    <button class="ctl" id="nextBtn" aria-label="السورة التالية">⏮</button>
    <span class="time" id="curTime">0:00</span>
    <input type="range" id="seek" min="0" max="0" step="1" value="0" aria-label="شريط التقدم">
    <span class="time" id="durTime">0:00</span>
    <label class="auto"><input type="checkbox" id="autoNext" checked> تلقائي</label>
  </div>
  <audio id="audio" preload="none"></audio>
</footer>

<script src="app.js"></script>
</body>
</html>
